<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#303f9c" />
<title>受注・問い合わせ管理｜林材木店</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23303f9c'/><text x='50' y='50' font-size='72' font-weight='bold' text-anchor='middle' dominant-baseline='central' fill='white' font-family='sans-serif'>注</text></svg>" />
<style>
  :root{
    --bg:#f4efe7; --panel:#fffdf9; --panel2:#faf6ef; --ink:#2e2a24; --muted:#8a8175;
    --line:#e6ddcf; --line2:#efe8dc; --brand:#7a5c3e; --brand-d:#5f472e; --accent:#c08a3e;
    --rakuten:#bf0000; --yahoo:#ff0033;
    --new:#2f6fed; --prep:#c08a3e; --ship:#1f9d72; --done:#8a8175;
    --todo:#d9534f; --doing:#c08a3e; --rep:#1f9d72;
    --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(80,60,30,.08);
    --radius:14px;
  }
  [data-theme="dark"]{
    --bg:#1c1916; --panel:#27231e; --panel2:#221f1a; --ink:#efe7da; --muted:#a99e8c;
    --line:#3a342c; --line2:#322d26; --panel:#27231e; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  button{font-family:inherit; cursor:pointer}
  .hidden{display:none !important}

  /* ===== Header ===== */
  header{
    position:sticky; top:0; z-index:30; background:var(--brand); color:#fff;
    padding:10px 14px calc(10px + env(safe-area-inset-top)); padding-top:max(10px,env(safe-area-inset-top));
    box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  .h-row{display:flex; align-items:center; gap:10px}
  .logo{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.15);display:grid;place-items:center;font-weight:700}
  .h-title{font-size:16px; font-weight:700; letter-spacing:.02em}
  .h-sub{font-size:11px; opacity:.8; margin-top:1px}
  .h-upd{font-size:10.5px; opacity:.75; margin-right:2px; white-space:nowrap}
  .h-spacer{flex:1}
  .icon-btn{background:rgba(255,255,255,.12); border:0; color:#fff; width:34px;height:34px;border-radius:9px; font-size:15px; display:grid;place-items:center}
  .icon-btn:active{transform:scale(.94)}

  /* KPI chips */
  .kpis{display:flex; gap:8px; margin-top:10px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px}
  .kpi{flex:0 0 auto; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18); border-radius:11px; padding:7px 11px; color:#fff; display:flex; align-items:center; gap:8px; min-width:96px}
  .kpi.active{background:#fff; color:var(--brand); border-color:#fff}
  .kpi .n{font-size:19px; font-weight:800; line-height:1}
  .kpi .l{font-size:10.5px; opacity:.9; line-height:1.15}
  .kpi.active .l{opacity:.7}

  /* Tabs */
  .tabs{display:flex; gap:6px; margin-top:10px}
  .tab{flex:1; background:rgba(255,255,255,.1); color:#fff; border:0; border-radius:10px 10px 0 0; padding:9px; font-size:13.5px; font-weight:700; opacity:.75}
  .tab.active{background:var(--bg); color:var(--brand); opacity:1}

  /* Toolbar */
  .toolbar{display:flex; gap:8px; align-items:center; padding:10px 14px 4px; flex-wrap:wrap}
  .seg{display:flex; background:var(--panel2); border:1px solid var(--line); border-radius:10px; overflow:hidden}
  .seg button{background:transparent; border:0; color:var(--muted); padding:7px 12px; font-size:12.5px; font-weight:600}
  .seg button.active{background:var(--brand); color:#fff}
  .search{flex:1; min-width:140px; display:flex; align-items:center; gap:6px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:7px 11px}
  .search input{border:0; background:transparent; outline:none; color:var(--ink); font-size:13.5px; width:100%}

  main{padding:8px 18px 100px; max-width:none; margin:0}

  /* ===== Kanban ===== */
  .board{display:grid; grid-template-columns:repeat(4,1fr); gap:12px}
  .col{background:var(--panel2); border:1px solid var(--line); border-radius:var(--radius); padding:9px; min-height:120px}
  .col-h{display:flex; align-items:center; gap:7px; padding:2px 4px 9px; font-size:13px; font-weight:700}
  .col-h .dot{width:9px;height:9px;border-radius:50%}
  .col-h .cnt{margin-left:auto; background:var(--panel); border:1px solid var(--line); color:var(--muted); font-size:11.5px; border-radius:20px; padding:1px 8px; font-weight:700}
  .col-h .col-note{background:#e7f6ef; color:#177a59; border:1px solid #bce6d3; font-size:10.5px; font-weight:800; border-radius:5px; padding:0 6px}
  [data-theme="dark"] .col-h .col-note{background:#1f3a30; color:#7fe0b8; border-color:#34492f}
  .col-h .col-note2{background:#fdecec; color:#c0392b; border:1px solid #f5c6c2; font-size:10.5px; font-weight:800; border-radius:5px; padding:0 6px}
  [data-theme="dark"] .col-h .col-note2{background:#3a2422; color:#ff9b91; border-color:#5a3330}
  .col-h .col-note2 + .cnt{margin-left:auto}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:10px; margin-bottom:9px; box-shadow:var(--shadow); cursor:pointer; transition:transform .08s}
  .card:active{transform:scale(.99)}
  .card .top{display:flex; align-items:center; gap:6px; margin-bottom:6px}
  .badge{font-size:10.5px; font-weight:800; color:#fff; border-radius:6px; padding:2px 7px; letter-spacing:.02em}
  .badge.rakuten{background:var(--rakuten)} .badge.yahoo{background:var(--yahoo)} .badge.ichiba{background:#2e7d32}
  .pill.doc-order{background:#e7f6ef; color:#177a59; border-color:#bce6d3; font-weight:800}
  .pill.doc-quote{background:#e8f1fd; color:#1a5dab; border-color:#bcd6f5; font-weight:800}
  .pill.doc-check{background:#fff4e5; color:#a06a14; border-color:#f3d9a8; font-weight:800}
  .doc-text{white-space:pre-wrap; font-size:11.5px; line-height:1.6; max-height:260px; overflow:auto; background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:10px; margin-top:6px}
  .i-sum{font-size:11.5px; color:var(--muted); line-height:1.45; margin:2px 0 4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  /* 加工予定表エディタ（予定表と同じ横一列の表形式） */
  .ked-wrap{overflow-x:auto; margin:4px -4px 8px; padding:0 4px}
  .ked-t{border-collapse:collapse; white-space:nowrap; font-size:12.5px}
  .ked-t th{font-size:10.5px; color:var(--muted); font-weight:700; padding:2px 4px; text-align:center; border-bottom:1.5px solid var(--line)}
  .ked-t td{padding:3px 3px; border-bottom:1px solid var(--line); text-align:center; vertical-align:middle}
  .ked-t .txt,.ked-t .sel{padding:5px 6px; font-size:12.5px; text-align:center}
  .ked-t input[type=checkbox]{width:16px;height:16px}
  .card .ono{font-size:11px; color:var(--muted); font-weight:600; margin-left:auto}
  .card .ono-link{font-size:11px; color:var(--brand); font-weight:700; margin-left:auto; text-decoration:none; white-space:nowrap; padding:2px 4px; border-radius:6px}
  .card .ono-link:hover{text-decoration:underline; background:var(--panel2)}
  .card .cust{font-size:14px; font-weight:700; margin-bottom:2px}
  /* 商品行=2行構成(④): 1行目=F/Pチップ+寸法、2行目=等級/B級/加工タグ、右端=×数量+入数 */
  .card .items{font-size:12px; color:var(--muted); display:flex; flex-direction:column}
  .i-item{display:flex; align-items:center; gap:8px; padding:4px 0; border-bottom:1px dashed var(--line)}
  .i-item:last-child{border-bottom:none}
  .i-main{min-width:0}
  .i-l1{display:flex; align-items:center; gap:7px; font-size:13px; font-weight:700; color:var(--ink); flex-wrap:wrap; row-gap:3px; flex:1 1 100%}
  .i-cntl{margin-left:auto; display:flex; align-items:baseline; gap:6px; flex:0 0 auto}
  .i-cntl .i-nyu{font-size:11px; color:var(--muted); font-weight:600}
  .i-cntl .i-set{font-size:14px; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums}
  .i-hin{flex:0 0 auto; width:18px; height:18px; border-radius:5px; color:#fff; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center}
  .i-dim{font-variant-numeric:tabular-nums; letter-spacing:.01em}
  .i-len.cut{background:#fce4ec; color:#c2185b; border-radius:4px; padding:0 3px}
  .i-l2{display:flex; gap:5px; margin-top:2px; flex-wrap:wrap}
  .i-g{font-size:13px; font-weight:800; border:1px solid; border-radius:4px; padding:0 5px}
  .i-tag{font-size:13px; font-weight:800; border-radius:4px; padding:0 5px; border:1px solid var(--line2); color:var(--muted); background:var(--panel2)}
  .i-tag.bc{background:#f3e8fa; border-color:#dcc6ef; color:#7b1fa2}
  .i-tag.bc.c{background:#fdeee4; border-color:#f0c49c; color:#b34700}
  .i-tag.cut{background:#fce4ec; border-color:#f8bbd0; color:#c2185b}
  .i-cnt{margin-left:auto; flex:0 0 auto; text-align:right; font-weight:800; font-size:14px; color:var(--ink); font-variant-numeric:tabular-nums}
  .i-cnt small{display:block; font-size:10px; color:var(--muted); font-weight:600}
  [data-theme="dark"] .i-tag.bc{background:#2a1f36; border-color:#4a3760; color:#c99ae0}
  [data-theme="dark"] .i-tag.cut,[data-theme="dark"] .i-len.cut{background:#3a1f2c; border-color:#5a3345; color:#ff8fb1}
  .i-head{font-weight:700}
  .i-type{display:inline-block; padding:1px 7px; border-radius:6px; font-weight:800; font-size:11.5px; line-height:1.5}
  .i-dim{color:var(--ink); font-weight:700}
  .i-qty{color:var(--muted)}
  .i-fushi{font-weight:800}
  .i-grade{color:#c62828; font-weight:800}
  .i-mult{color:var(--brand); font-weight:800}
  .i-sep{color:var(--line); margin:0 3px}
  table.items-t .i-head{opacity:1}
  .card .foot{display:flex; align-items:center; gap:8px; margin-top:8px}
  .card .price{font-size:14px; font-weight:800}
  .card .date{font-size:11px; color:var(--muted); margin-left:auto}
  .col .done-card{box-shadow:none; background:var(--panel2); border-color:var(--line2); opacity:.5}
  .col .done-card:hover{opacity:.85}
  .col .done-card .nextbtn{display:none}
  /* B級/C級は該当商品の行(.i-line.ib/.ic)だけ背景色で表示（カード全体には付けない） */
  .card .flagrow{display:flex; gap:6px; margin-top:7px; flex-wrap:wrap}
  .pill{font-size:10.5px; border-radius:20px; padding:2px 8px; font-weight:700; border:1px solid var(--line2)}
  .pill.warn{background:#fdecec; color:#c0392b; border-color:#f5c6c2}
  .pill.msg{background:#eef4ff; color:#2f6fed; border-color:#cfe0ff}
  .pill.memo{background:var(--panel2); color:var(--muted)}
  .pill.memo-on{background:#fff8e1; color:#8a6d1a; border-color:#f0dca0; font-weight:800; cursor:help}
  [data-theme="dark"] .pill.memo-on{background:#33290f; color:#e0c074; border-color:#5a4a1e}
  .pill.opt{background:#f3e8ff; color:#7b1fa2; border-color:#e3cdf5; font-weight:800}
  .pill.opt-none{background:transparent; color:var(--muted); border-color:var(--line2)}
  .pill.cust-corp{background:#e8eefb; color:#1f4fb5; border-color:#c6d6f5; font-weight:800}
  .pill.cust-indiv{background:#eef6ee; color:#2e7d32; border-color:#cfe6cf; font-weight:800}
  [data-theme="dark"] .pill.cust-corp{background:#1c2740;color:#9db9f0;border-color:#2f415f}
  [data-theme="dark"] .pill.cust-indiv{background:#1f2e1f;color:#9fd4a2;border-color:#34492f}
  .pill.kakou-ok{background:#e7f6ef; color:#177a59; border-color:#bce6d3; font-weight:800}
  .pill.pay-wait{background:#fdecec; color:#c0392b; border-color:#f5c6c2; font-weight:800}
  .pill.kakou-ng{background:#c0392b; color:#fff; border-color:#c0392b; font-weight:800}
  .pill.ship-wait{background:#fff4e5; color:#a06a14; border-color:#f3d9a8; font-weight:800}
  .pill.mail-wait{background:#fff0f0; color:#b3261e; border-color:#f3c2bd; font-weight:800}
  [data-theme="dark"] .pill.mail-wait{background:#3a2422;color:#ff9b91;border-color:#5a3330}
  [data-theme="dark"] .pill.kakou-ok{background:#1f3a30;color:#7fe0b8;border-color:#34492f}
  [data-theme="dark"] .pill.pay-wait{background:#3a2422;color:#ff9b91;border-color:#5a3330}
  [data-theme="dark"] .pill.kakou-ng{background:#8e2a1f;color:#fff;border-color:#8e2a1f}
  [data-theme="dark"] .pill.ship-wait{background:#332a18;color:#e3b65f;border-color:#5a4a26}
  .prep-box{background:var(--panel2); border:1px solid var(--line); border-radius:11px; padding:11px 12px; margin:2px 0 4px}
  .prep-box.ok{background:#eef9f3; border-color:#bce6d3}
  [data-theme="dark"] .prep-box.ok{background:#1c3329;border-color:#34492f}
  .prep-line{display:flex; justify-content:space-between; font-size:13px; margin-bottom:8px}
  .prep-line .done{color:#177a59; font-weight:700}
  .prep-line .wait{color:#c0392b; font-weight:700}
  .prep-check{display:flex; gap:8px; align-items:flex-start; font-size:13px; line-height:1.4; cursor:pointer}
  .prep-check input{margin-top:2px; width:18px; height:18px; accent-color:var(--brand)}
  .prep-result{margin-top:9px; font-size:12.5px; color:var(--muted); border-top:1px dashed var(--line); padding-top:8px}
  .prep-box.ok .prep-result{color:#177a59}
  .pill.prog{background:#eef4ff; color:#2f6fed; border-color:#cfe0ff; font-weight:700}
  [data-theme="dark"] .pill.prog{background:#1f2a3f;color:#9cc0ff;border-color:#2f415f}
  .pill.date-spec{background:#fdecec; color:#c0392b; border-color:#f5c6c2; font-weight:800}
  [data-theme="dark"] .pill.date-spec{background:#3a2422;color:#ff9b91;border-color:#5a3330}
  .remarks-box{background:#fffbe9; border:1px solid #f0e3b0; border-left:3px solid #c0392b; border-radius:10px; padding:10px 12px; font-size:13px; line-height:1.55; white-space:pre-wrap; margin:4px 0 6px}
  [data-theme="dark"] .remarks-box{background:#2e2a18;border-color:#5a4a26;color:#e8dcc0}
  .opmemo-box{background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:8px 11px; font-size:12.5px; line-height:1.5; white-space:pre-wrap; color:var(--ink)}
  .rk-warn{background:#fff4e5; color:#8a5a12; border:1px solid #f3d9a8; border-radius:10px; padding:9px 11px; font-size:12px; line-height:1.5; margin-bottom:10px}
  [data-theme="dark"] .rk-warn{background:#332a18;color:#e3b65f;border-color:#5a4a26}
  [data-theme="dark"] .pill.opt{background:#2e2140;color:#d4a8f5;border-color:#46315e}
  [data-theme="dark"] .pill.warn{background:#3a2422;color:#ff9b91;border-color:#5a3330}
  [data-theme="dark"] .pill.msg{background:#1f2a3f;color:#9cc0ff;border-color:#2f415f}
  .nextbtn{width:100%; margin-top:8px; background:var(--panel2); border:1px dashed var(--line); color:var(--brand); border-radius:9px; padding:7px; font-size:12px; font-weight:700}
  .nextbtn:active{background:var(--line2)}
  .col-empty{color:var(--muted); font-size:12px; text-align:center; padding:18px 6px}

  /* ===== Inquiry list ===== */
  .list{display:grid; grid-template-columns:repeat(auto-fill,minmax(440px,1fr)); gap:10px; align-items:start}
  .qrow{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:11px 12px; box-shadow:var(--shadow); cursor:pointer; display:flex; gap:11px; align-items:flex-start}
  .qrow:active{transform:scale(.997)}
  .qrow .left{flex:1; min-width:0}
  .qrow .qhead{display:flex; align-items:center; gap:7px; margin-bottom:3px; flex-wrap:wrap}
  .qrow .subj{font-weight:700; font-size:14px}
  .qrow .excerpt{font-size:12.5px; color:var(--muted); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .qrow .meta{font-size:11px; color:var(--muted); margin-top:5px; display:flex; gap:10px; flex-wrap:wrap}
  .st{font-size:10.5px; font-weight:800; border-radius:20px; padding:3px 9px; white-space:nowrap}
  .st.todo{background:#fdecec; color:#c0392b} .st.doing{background:#fbf0dc; color:#a06a14} .st.done{background:#e7f6ef; color:#177a59}
  [data-theme="dark"] .st.todo{background:#3a2422;color:#ff9b91}
  [data-theme="dark"] .st.doing{background:#3a3320;color:#e3b65f}
  [data-theme="dark"] .st.done{background:#1f3a30;color:#7fe0b8}

  /* ===== Drawer ===== */
  .scrim{position:fixed; inset:0; background:rgba(20,16,10,.45); z-index:50; opacity:0; pointer-events:none; transition:opacity .18s}
  .scrim.on{opacity:1; pointer-events:auto}
  .drawer{position:fixed; top:0; right:0; height:100%; width:min(480px,100%); background:var(--bg); z-index:60; transform:translateX(102%); transition:transform .22s cubic-bezier(.2,.8,.2,1); display:flex; flex-direction:column; box-shadow:-8px 0 30px rgba(0,0,0,.2)}
  .drawer.on{transform:none}
  .d-head{display:flex; align-items:center; gap:10px; padding:14px; border-bottom:1px solid var(--line); background:var(--panel)}
  .d-head .badge{font-size:11px}
  .d-head h3{margin:0; font-size:15px}
  .d-close{margin-left:auto; background:var(--panel2); border:1px solid var(--line); color:var(--ink); width:32px;height:32px;border-radius:9px; font-size:16px}
  .d-body{padding:14px; overflow:auto; flex:1}
  .d-foot{padding:12px 14px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:var(--panel); display:flex; gap:9px; flex-wrap:wrap}

  .kv{display:grid; grid-template-columns:84px 1fr; gap:6px 10px; font-size:13.5px; margin-bottom:14px}
  .kv .k{color:var(--muted)}
  .kv .v{font-weight:600}
  .sec-t{font-size:11.5px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin:16px 0 8px}
  table.items-t{width:100%; border-collapse:collapse; font-size:13px}
  table.items-t th{text-align:left; color:var(--muted); font-weight:600; font-size:11.5px; border-bottom:1px solid var(--line); padding:5px 4px}
  table.items-t td{padding:7px 4px; border-bottom:1px solid var(--line2)}
  table.items-t td.num{text-align:right; white-space:nowrap}
  .total-row{display:flex; justify-content:space-between; align-items:center; margin-top:10px; font-weight:800; font-size:15px}

  .status-pick{display:flex; gap:6px; flex-wrap:wrap}
  .status-pick button{border:1px solid var(--line); background:var(--panel); color:var(--muted); border-radius:9px; padding:8px 11px; font-size:12.5px; font-weight:700}
  .status-pick button.active{color:#fff; border-color:transparent}
  .status-pick button.active[data-s="new"]{background:var(--new)}
  .status-pick button.active[data-s="preparing"]{background:var(--prep)}
  .status-pick button.active[data-s="shipped"]{background:var(--ship)}
  .status-pick button.active[data-s="done"]{background:var(--done)}
  .status-pick button.active[data-s="todo"]{background:var(--todo)}
  .status-pick button.active[data-s="doing"]{background:var(--doing)}
  .status-pick button.active[data-s="replied"]{background:var(--rep)}

  label.fld{display:block; font-size:12px; color:var(--muted); font-weight:600; margin:12px 0 5px}
  input.txt, textarea.txt, select.sel{width:100%; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:10px; padding:10px 11px; font-size:13.5px; font-family:inherit; outline:none}
  textarea.txt{min-height:120px; resize:vertical; line-height:1.5}
  input.txt:focus, textarea.txt:focus, select.sel:focus{border-color:var(--brand)}

  .msg-quote{background:var(--panel2); border:1px solid var(--line); border-left:3px solid var(--brand); border-radius:10px; padding:11px 12px; font-size:13.5px; line-height:1.6; white-space:pre-wrap; max-height:230px; overflow:auto}

/* ---------- state ---------- */
const LS = {
  cred:"orderdesk_cred", theme:"orderdesk_theme", tpl:"orderdesk_templates",
  oOverlay:"orderdesk_order_overlay", qOverlay:"orderdesk_inq_overlay",
  extraO:"orderdesk_extra_orders", extraQ:"orderdesk_extra_inq",
  serverCache:"orderdesk_server_cache"
};
let state = {
  tab:"orders", mall:"all", search:"",
  orders:[], inquiries:[], templates:[],

};

function load(k, def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

/* 共通SSO: h02050d-ship-it.github.io の他ツールのログインを引き継ぐ */
const SSO_KEY="hayazai_sso_cred";
const SSO_PEERS=["hayazai_board_cred","hayazai_seiso_cred","hayazai_rulebook_cred","hayazai_kaizen_cred","notify_creds_v1","seinodesk_cred","faxdesk_cred","orderdesk_cred","nippou_cred"];
function ssoFind_(){
  const keys=[SSO_KEY].concat(SSO_PEERS);
  for(const k of keys){
    try{ const v=JSON.parse(localStorage.getItem(k)||"null");
      if(v){ const email=v.email||v.e, pass=v.pass||v.p; if(email&&pass) return {email:String(email),pass:String(pass)}; }
    }catch(e){}
  }
  return null;
}
function ssoWrite(email,pass){ try{ localStorage.setItem(SSO_KEY,JSON.stringify({email:email,pass:pass})); }catch(e){} }
function ssoClear(){ try{ localStorage.removeItem(SSO_KEY); }catch(e){} }

/* ---- サーバ(GAS)連携層。API_URLが空ならデモ＋localStorage ---- */
const SERVER = { loaded:false, orders:[], inquiries:[], templates:[] };
let CRED = null; // {email,pass}

function buildData(){
  if(API_URL){ // 本番：サーバが真実。テンプレは端末ローカル維持
    state.orders     = SERVER.loaded ? SERVER.orders     : [];
    state.inquiries  = SERVER.loaded ? SERVER.inquiries  : [];
    state.templates  = load(LS.tpl, (SERVER.templates&&SERVER.templates.length)?SERVER.templates:DEFAULT_TEMPLATES);
    return;
  }
  // デモ：DEMO + 手動追加 + localStorage overlay
  const oOv = load(LS.oOverlay, {});       // id -> {status,memo,tracking}
  const qOv = load(LS.qOverlay, {});        // id -> {status, history, draft}
  const extraO = load(LS.extraO, []);
  const extraQ = load(LS.extraQ, []);
  state.orders = [...DEMO_ORDERS, ...extraO].map(o=>{
    const ov = oOv[o.id]||{};
    return {...o, status:ov.status||o.status, memo:ov.memo!==undefined?ov.memo:o.memo, tracking:ov.tracking!==undefined?ov.tracking:o.tracking, customer:ov.customer!==undefined?ov.customer:o.customer};
  });
  state.inquiries = [...DEMO_INQUIRIES, ...extraQ].map(q=>{
    const ov = qOv[q.id]||{};
    return {...q, status:ov.status||q.status, history:ov.history||q.history||[], draft:ov.draft||""};
  });
  state.templates = load(LS.tpl, DEFAULT_TEMPLATES);
}

async function loadFromServer(){
  if(!API_URL || !CRED) return;
  const cache = load(LS.serverCache, null); // stale-while-revalidate：まず前回分を即表示
  if(cache && !SERVER.loaded){ SERVER.orders=cache.orders||[]; SERVER.inquiries=cache.inquiries||[]; SERVER.templates=cache.templates||[]; SERVER.loaded=true; buildData(); render(); }
  try{
    const u = new URL(API_URL);
    u.searchParams.set("action","board"); u.searchParams.set("email",CRED.email); u.searchParams.set("pass",CRED.pass);
    const res = await fetch(u.toString(), {method:"GET"});
    const data = await res.json();
    if(!data.ok){
      if(data.error==="unauthorized"){ // 認証失敗→ログイン画面へ戻す
        localStorage.removeItem(LS.cred); sessionStorage.removeItem(LS.cred); ssoClear(); CRED=null;
        $("#app").classList.add("hidden"); $("#gate").classList.remove("hidden");
        $("#g-err").textContent="メールまたはパスワードが違います";
      } else { toast("取得に失敗しました"); }
      return;
    }
    SERVER.orders=data.orders||[]; SERVER.inquiries=data.inquiries||[]; SERVER.templates=data.templates||[]; SERVER.loaded=true;
    save(LS.serverCache, {orders:SERVER.orders, inquiries:SERVER.inquiries, templates:SERVER.templates});
    buildData(); render();
    const upd=$("#h-upd"); if(upd) upd.textContent="更新 "+new Date().toTimeString().slice(0,5);
    autoKakouSync(); // 加工OKになった注文を加工予定表へ自動登録
  }catch(e){ toast("サーバ取得に失敗（オフライン表示）"); }
}
function apiPost(body){
  if(!API_URL || !CRED) return;
  try{
    fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(Object.assign({email:CRED.email, pass:CRED.pass}, body))}).catch(()=>{});
  }catch(e){}
}

function saveOrderOverlay(o){
  if(API_URL){
    const body={action:"order", id:o.id, status:o.status, memo:o.memo, tracking:o.tracking, customer:o.customer};
    ["corpName","corpZip","corpAddr","dueOverride","shipDate"].forEach(k=>{ if(o[k]!==undefined) body[k]=o[k]; });  // 法人届け先・合意着日・発送日（欄が無い注文では送らない=消さない）
    apiPost(body); return; }
  const ov = load(LS.oOverlay, {});
  ov[o.id] = {status:o.status, memo:o.memo, tracking:o.tracking, customer:o.customer};
  save(LS.oOverlay, ov);
}
function saveInqOverlay(q){
  if(API_URL){ apiPost({action:"inquiry", id:q.id, status:q.status, draft:q.draft||"", history:q.history||[]}); return; }
  const ov = load(LS.qOverlay, {});
  ov[q.id] = {status:q.status, history:q.history, draft:q.draft||""};
  save(LS.qOverlay, ov);
}

const yen = n=>(Number(n)===-9999?"送料未確定":"¥"+Number(n||0).toLocaleString("ja-JP"));
const esc = s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// 節（等級）の色＝加工予定表に準拠。節有＝丸節と同じ赤
const GRADE_COLORS={"丸節":"#d32f2f","節有":"#d32f2f","節あり":"#d32f2f","節":"#d32f2f","小節":"#ef6c00","小":"#ef6c00","上小節":"#2e7d32","特上小節":"#2e7d32","特上小":"#2e7d32","特上":"#2e7d32","無節特上":"#6a1b9a","特上無節":"#6a1b9a","無節":"#1565c0","節無":"#1565c0","生節":"#795548"};
function gradeColor(f){ return GRADE_COLORS[f]||"#6a5a44"; }
// 品種チップの色＝加工予定表に準拠（F=赤/12mm黄, P=青, S=紫, N=緑）。品種=チップ・節=色文字で区別
const TYPE_BG={"フローリング":"#d32f2f","羽目板":"#1565c0","スノコ板":"#6a1b9a","スノコ":"#6a1b9a","野地板":"#2e7d32","破風板":"#5d4037","破風":"#5d4037","笠木":"#7b1fa2","框":"#8d6e63","無垢板":"#6d4c41"};
function typeChip(type, thick){
  let bg=TYPE_BG[type]||"#6a5a44";
  if(type==="フローリング" && String(thick)==="12") bg="#f9a825"; // 加工予定表: フローリング12mm=黄
  return {bg, fg:(bg==="#f9a825"?"#3a2a00":"#fff")};            // 明るい黄だけ黒文字
}
// 注文のオプション（カット/塗装等）。明細のopt＋商品名キーワードから検出
function orderOptions(o){
  const set=new Set();
  (o.items||[]).forEach(i=>{
    if(i.opt) set.add(String(i.opt));
    const n=String(i.name||"");
    if(/直角カット|両端カット|長さ?カット|カット加工|裁断/.test(n)) set.add("カット");
    if(/自然塗装|オイル塗装|ウレタン塗装|塗装仕上|塗装$/.test(n)) set.add("塗装");
  });
  return [...set];
}
// 商品タイトルを構造化（A級は標準なので等級ラベルは付けない＝B/Cのみ表示）
function parseItem(name){
  const s=String(name||"").replace(/[　]/g," ").replace(/\s+/g," ").trim();
  const grade=(s.match(/([A-C])\s*級/)||[])[1]||"";
  const wood=/杉|すぎ|スギ/.test(s)?"杉":(/桧|檜|ひのき|ヒノキ/.test(s)?"桧":"");
  let type=(s.match(/フローリング|羽目板|野地板|スノコ板?|破風板?|笠木|框|無垢板/)||[])[0]||"";
  if(/目透/.test(s)) type="羽目板"; else if(/突付|突き付|突きつけ|本実突/.test(s)) type="フローリング"; // 本実目透=羽目板 / 本実突付=フローリング（工法で確定）
  const dim=(s.match(/\d{1,3}\s*[×x]\s*\d{1,3}\s*[×x]\s*\d{3,4}/)||[""])[0].replace(/\s/g,"").replace(/x/gi,"×");
  let qty=""; const qm=s.match(/【\s*(\d+)\s*枚/)||s.match(/(\d+)\s*枚入/); if(qm) qty=qm[1]+"枚入";
  const fushi=(s.match(/特上無節|無節特上|特選上小|選上小|特上小節|特上小|上小節|小節|丸節|生節|無節|特上|節有|節あり|節無|節|小/)||[])[0]||"";
  return {grade,wood,type,dim,qty,fushi,raw:s};
}
function cleanItem(name){ // プレーンテキスト（tooltip等）
  const p=parseItem(name);
  const head=((p.grade&&p.grade!=="A"?p.grade+"級 ":"")+(p.wood+p.type)).trim();
  const parts=[head,p.dim,p.qty,p.fushi].filter(Boolean);
  return parts.length>=2 ? parts.join(" ") : p.raw;
}
// 色付きHTML。qty>1なら ×n を付与。樹種種類は控えめ、寸法は太字、節は色分け、B/C級は赤で強調
function itemHTML(name, qty){
  const p=parseItem(name);
  if(!p.wood && !p.type && !p.dim) return esc(name);
  let h="";
  if(p.grade && p.grade!=="A") h+=`<b class="i-grade">${esc(p.grade)}級</b> `;
  const thick=(p.dim.match(/^(\d{1,3})/)||[])[1]||"";
  if(p.type){ const ch=typeChip(p.type,thick); h+=`<span class="i-type" style="background:${ch.bg};color:${ch.fg}">${esc(p.wood+p.type)}</span>`; }
  else if(p.wood){ h+=`<span class="i-head">${esc(p.wood)}</span>`; }
  if(p.dim) h+=` <span class="i-dim">${esc(p.dim)}</span>`;
  if(p.qty) h+=` <span class="i-qty">${esc(p.qty)}</span>`;
  if(p.fushi) h+=` <span class="i-fushi" style="color:${gradeColor(p.fushi)}">${esc(p.fushi)}</span>`;
  if(qty>1) h+=` <span class="i-mult">×${qty}</span>`;
  return h;
}
// カード用（2行構成）: 1行目=品種チップ(加工予定表と同じF/P/S色)+寸法、2行目=等級(加工予定表の色)/B級/加工タグ、右端=×数量+入数
// 等級名は加工予定表準拠に統一（節有→丸節 等）。カット対象は長さピンク＋タグ
const KAKOU_GRADE_COLORS={"丸節":"#d32f2f","小節":"#ef6c00","特上小":"#2e7d32","無節":"#1565c0","無節特上":"#6a1b9a","生節":"#795548"};
function hinChip(type,thick){ // 加工予定表のbgMapと同じ配色
  const hin=/フローリング/.test(type)?"F":/羽目板/.test(type)?"P":/スノコ/.test(type)?"S":"";
  if(!hin) return null;
  const bg=hin==="F"?(String(thick)==="12"?"#f9a825":"#d32f2f"):hin==="P"?"#1565c0":"#6a1b9a";
  return {hin,bg};
}
function itemLineHTML(it){
  const p=parseItem(it.name);
  const n=Number(it.qty)||1;
  const opt=String(it.opt||"");
  const cut=/カット/.test(opt), tosou=/塗装/.test(opt);
  if(!p.wood && !p.type && !p.dim){
    return `<div class="i-item"><div class="i-main"><div class="i-l1"><span class="i-name">${esc(cleanItem(it.name))}</span></div></div><div class="i-cnt">×${n}</div></div>`;
  }
  const thick=(p.dim.match(/^(\d{1,3})/)||[])[1]||"";
  const isB=p.grade==="B", isC=p.grade==="C";
  const ch=hinChip(p.type,thick);
  let dimHtml="";
  if(p.dim){
    const parts=p.dim.split("×"); const len=parts.pop();
    if(parts.length===2 && /フローリング|羽目板/.test(p.type)) parts[1]="120"; // 幅は原板120表記
    dimHtml=`<span class="i-dim">${esc(parts.join("×"))}×<span class="i-len${cut?" cut":""}">${esc(len)}</span></span>`;
  }
  const gname=kakouGradeOf(p.fushi,"");            // 加工予定表準拠の等級名(節有→丸節)
  const gc=KAKOU_GRADE_COLORS[gname]||"#6a5a44";
  let tags="";
  if(gname && gname!=="-") tags+=`<span class="i-g" style="color:${gc};background:${gc}14;border-color:${gc}44">${esc(gname)}</span>`;
  if(isB||isC) tags+=`<span class="i-tag bc${isC?" c":""}">${p.grade}級</span>`;
  if(cut) tags+=`<span class="i-tag cut">両端カット</span>`;
  if(tosou) tags+=`<span class="i-tag cut">🎨 塗装</span>`;
  return `<div class="i-item">
    <div class="i-l1">${ch?`<span class="i-hin" style="background:${ch.bg}">${ch.hin}</span>`:(p.wood?`<span class="i-name">${esc(p.wood+p.type)}</span>`:"")}${dimHtml}${tags}<span class="i-cntl">${p.qty?`<span class="i-nyu">${esc(p.qty)}</span>`:""}<span class="i-set">×${n}</span></span></div>
  </div>`;
}
function itemsSummaryHTML(items){ return (items||[]).map(itemLineHTML).join(''); }
function corpAbbrev(s){ return String(s||"").replace(/株式会社/g,"(株)").replace(/有限会社/g,"(有)").replace(/合同会社/g,"(同)").replace(/合資会社/g,"(資)").trim(); } // 法人格の略記
function orderName(o){
  const base=o.customer ? esc(o.customer)+" 様" : "＃"+esc(String(o.orderNo||"").split("-").pop());
  return o.corpName ? base+'<span style="font-weight:700;opacity:.85">｜'+esc(corpAbbrev(o.corpName))+'</span>' : base; // 確認済みの法人名を併記（送り状宛名・予定表との照合用）
}
// 楽天の進捗ラベル・2m以上(運賃見積り要)判定
const RK_PROGRESS_LABEL={100:"注文確認待ち",200:"楽天処理中",300:"発送待ち",400:"変更確定待ち",500:"発送済",600:"入金待ち",700:"入金済"};
function itemMaxLen(o){ let mx=0; (o.items||[]).forEach(i=>{ const d=parseItem(i.name).dim; if(d){ const p=d.split("×"); const L=Number(p[p.length-1])||0; if(L>mx) mx=L; } }); return mx; }
// 加工予定表の表示名用の姓/社名（法人は「株式会社 樓蘭」→樓蘭。旧ロジックは1語目=「株式会社」になるバグ）
function kakouSur(customer){
  const parts=String(customer||"").trim().split(/[ 　]+/).filter(Boolean);
  if(!parts.length) return "";
  if(/^(株式会社|有限会社|合同会社|合資会社|\(株\)|（株）|\(有\)|（有）)$/.test(parts[0]) && parts[1]) return parts[1];
  return (parts[0].replace(/^(株式会社|有限会社|合同会社|\(株\)|（株）|\(有\)|（有）)/,"")||parts[0]);
}
function needsFreight(o){ return (o.mall==="rakuten"||o.mall==="yahoo") && itemMaxLen(o)>=1820; } // 2m以上＝運賃見積り（楽天・ヤフーとも。2m=1820表記）
// 運賃ツール連携URL（届け先住所＋都道府県＋長さ区分＋束数を渡して自動計算・営業所検索）
const FARE_URL="https://h02050d-ship-it.github.io/fare-calculator/";
function lengthClass(len){ return len>=4000?4:len>=3000?3:len>=1820?2:1; }
function sokuTaba(o){ let t=0; (o.items||[]).forEach(it=>{const p=parseItem(it.name); if(!p.dim) return; const d=p.dim.split("×"); const len=Number(d[2])||0; const per=parseInt(p.qty)||0,n=Number(it.qty)||1,tot=per*n; if(!tot) return; t+=Math.ceil(tot/(len<1820?20:10));}); return t||1; }
// 長さクラス(1m/2m/3m/4m)別の束数を集計（混載運賃の正確計算用）
function sokuTabaByLen(o){
  const by={1:0,2:0,3:0,4:0};
  (o.items||[]).forEach(it=>{const p=parseItem(it.name); if(!p.dim) return; const d=p.dim.split("×"); const len=Number(d[2])||0; const per=parseInt(p.qty)||0,n=Number(it.qty)||1,tot=per*n; if(!tot) return; by[lengthClass(len)]+=Math.ceil(tot/(len<1820?20:10));});
  return by;
}
function fareUrl(o){
  const u=new URL(FARE_URL); if(o.shipPref)u.searchParams.set('pref',o.shipPref);
  const by=sokuTabaByLen(o), classes=Object.keys(by).filter(k=>by[k]>0);
  if(classes.length>=2){ // 混載＝長さ別束数(q1〜q4)で渡す（最大長×総束数だと過大計算になるため）
    classes.forEach(k=>u.searchParams.set('q'+k,by[k]));
  } else {
    u.searchParams.set('len',lengthClass(itemMaxLen(o))); u.searchParams.set('qty',sokuTaba(o));
  }
  if(o.shipAddr)u.searchParams.set('addr',o.shipAddr); return u.toString();
}

    if(o && window._genOnFare===o.id){ window._genOnFare=null; try{ genConfirmMail(); }catch(e){} }  // 「生成」ボタンからの運賃計算: 到着したら文面生成（総額なしでも生成し手入力を促す）

    // 再発防止: 運賃ツールが計算した数量と、注文明細から算出した束数が食い違ったら警告（混載の渡し漏れ・手修正忘れ検知）
    if(o&&d.mix){

    if(d.total) rows.push(`<div class="prep-line"><span>💰 送料（税込）</span><span style="font-weight:800;font-size:15px">${esc(d.total)}</span></div>`);

function rkProgressLabel(o){ if(o.mall!=="rakuten") return ""; return RK_PROGRESS_LABEL[o.progress] || "注文確認待ち"; }
function ageDays(o){ const d=new Date(String(o.date||"").replace(" ","T")); return isNaN(d)?0:Math.floor((Date.now()-d.getTime())/86400000); }
// 配送業者判定：大型宅配便=西濃(2m・要配送確認/メール)、宅配便=佐川(1m・確認不要)、メール便=日本郵便(サンプル)。未取得時は長さで推定(2m以上=西濃)
function shipCarrier(o){
  const dm=String(o.deliveryMethod||'');
  if(/西濃/.test(dm)) return "西濃";            // ヤフーAPIは配送方法に運送会社名が入る（例:「佐川急便1ｍ40枚（宅配）」）
  if(/佐川/.test(dm)) return "佐川";
  if(/日本郵便|ゆうパック|ゆうパケット|メール便/.test(dm)) return "日本郵便";
  if(/大型/.test(dm)) return "西濃";            // 楽天=大型宅配便
  if(/宅配便/.test(dm)) return "佐川";          // 楽天=宅配便
  return itemMaxLen(o)>=1820 ? "西濃" : "佐川"; // 未取得は長さで推定：2m系(1820〜)=西濃
}
// 配送確認メール・配送確認チェックが必要なのは西濃(2m・支店止め/運賃見積り)のみ。佐川/メール便は不要
function needsShipConfirm(o){ return shipCarrier(o)==="西濃"; }
// 加工準備：支払確認(楽天=API/ヤフー=当面手動扱い)＋配送確認(西濃のみ手動チェック)が揃えば加工OK
// 判断軸: 出荷準備中以降に進んだ時点で「配送確認・メール送信」は済んでいる扱い（新規受注でのみ未確認がありうる）
function isPaidOk(o){ return (o.mall==="rakuten"||o.mall==="yahoo") ? !!o.paid : true; } // 楽天・ヤフーともAPIで入金状態を把握
function rkPreConfirm(o){ return o.mall==="rakuten" && (Number(o.progress)||100)<=100; } // 楽天prog100=注文確定(受注確定)ボタン前。銀行振込はstatusがnewのまま600(入金待ち)に進むためstatusでなくprogressで判定
function effShipConfirmed(o){ return !!o.shipConfirmed || o.status!=="new" || (o.mall==="rakuten" && !rkPreConfirm(o)); }
function kakouReady(o){ return isPaidOk(o) && (!needsShipConfirm(o) || effShipConfirmed(o)); }
// 注文フロー（配送確認 → 注文確定 → 支払い）の「一番直近でやる1ステップ」だけを返す。全部済み＝null（＝加工OK）。
// 楽天は progress100 の間が「注文確定(受注確定)待ち」→確定ボタンで支払確認へ。西濃2mのみ配送確認が要る。支払い＝入金(楽天API/ヤフー)。
function nextStep(o){
  if(needsShipConfirm(o) && !effShipConfirmed(o)) return {k:"ship",   label:"配送確認"};
  if(rkPreConfirm(o))                              return {k:"confirm",label:"注文確定"};
  if(!isPaidOk(o))                                 return {k:"pay",    label:"支払確認"};
  return null;
}
function workflowPillHTML(o){
  const st=nextStep(o);
  if(!st) return '<span class="pill kakou-ok">✅ 加工OK</span>';
  const m={ship:['ship-wait','🚚'], confirm:['prog','📋'], pay:['pay-wait','💰']}[st.k]||['prog',''];
  return '<span class="pill '+m[0]+'">'+m[1]+' '+st.label+'</span>';
}

/* ===== 加工予定表（kakou-yotei Firebase）自動入力 =====
   加工OK（支払＋配送確認済）になった注文を、確認なしで加工予定表に自動登録（人間が後でチェック）。
   行キーは od_注文ID_行番号 の固定キー → 何度書いても同じ行を上書き＝重複しない */

// EC商品名の節表記 → 加工予定表の等級選択肢（-,丸節,小節,特上小,無節,無節特上,生節,B丸節,B特上小）
function kakouGradeOf(fushi,bc){
  const g = /無節特上|特上無節/.test(fushi)?"無節特上"
        : /特上小|選上小|上小節|特上/.test(fushi)?"特上小"
        : /生節/.test(fushi)?"生節"
        : /小節|^小$/.test(fushi)?"小節"
        : /無節|節無/.test(fushi)?"無節"
        : /節/.test(fushi)?"丸節":"-";
  // B級は等級名で表す（備考の「B級品」は使わない）。該当の等級が無い場合は素の等級を返す
  if(bc==="B"){ if(g==="丸節")return "B丸節"; if(g==="特上小"||g==="無節特上")return "B特上小"; }
  return g;
}
// テスト注文（注文番号がTEST-…）は加工予定表の対象外
function isTestOrder(o){ return /(^|:)?TEST-/i.test(String(o.orderNo||"")) || /TEST-/i.test(String(o.id||"")); }
// 注文 → 加工予定表の行（1商品=1行）。品名F/P/S以外（サンプル・オプション行）は対象外。テスト注文は空
function kakouRowsFor(o){
  if(isTestOrder(o)) return [];
  const rows=[]; const carrier=shipCarrier(o);
  const st=nextStep(o);
  const actualVal = st ? st.label : "-";  // 実際列＝次にやる1ステップ（配送確認→注文確定→支払確認の順・加工OKで"-"）
  (o.items||[]).forEach((it,idx)=>{
    const p=parseItem(it.name);
    const hin = /フローリング/.test(p.type)?"F" : /羽目板/.test(p.type)?"P" : /スノコ/.test(p.type)?"S" : "";
    if(!hin || !p.dim) return;
    const d=p.dim.split("×"); if(d.length<3) return;
    const per=parseInt(p.qty)||0, n=Number(it.qty)||1, total=per*n;
    if(!total) return;
    const len=Number(d[2])||0;
    let qty,planned;
    if(len>=1820){ qty=10; planned=Math.ceil(total/10); }                                // 2m系: 10枚1個口（20枚1セット→予定2）
    else { planned=Math.max(1,Math.ceil(total/40)); qty=Math.ceil(total/planned); }      // 1m系: 40枚まで1個口
    const opt=String(it.opt||"");
    const grade=kakouGradeOf(p.fushi,p.grade);
    const rem=[];  // 西濃/佐川は配送列に入れるので備考には書かない
    if(o.custType==="個人"&&carrier==="西濃") rem.push((o.branch||"")+"支店止め");  // 支店止めは西濃のみ（佐川個人は宅配）
    if(/納品書/.test(String(o.remarks||""))) rem.push("納品書同梱");  // ヤフーNeedDetailedSlip→備考経由(2026-07-31)
    const _effDue=o.dueOverride||o.deliveryDate; if(_effDue) rem.push(String(_effDue).slice(5).replace("-","/")+"着指定");  // 合意した着指定日を優先
    // B級は等級名（B丸節/B特上小）で表す。等級で表せない組合せ（B+無節等）のみ備考に残す
    if(p.grade==="B" && !/^B/.test(grade)) rem.push("B級品");
    const pre=o.mall==="rakuten"?"楽天":o.mall==="yahoo"?"ヤフ":o.mall==="ichiba"?"":"ネット";  // 名前プレフィックス(様なし)
    // 法人名を確認済みなら「楽天(株)◯◯」形式（送り状宛名と同一表記・スペース除去）。未確認は姓/社名主要部
    const sur=o.mall==="ichiba"?ichibaShortName(o.customer):(o.corpName?corpAbbrev(o.corpName).replace(/[ 　]+/g,""):kakouSur(o.customer));
    const carVal=carrier==="西濃"?"西濃":carrier==="佐川"?"佐川":"";  // 配送列（佐川1m宅配も出す・GAS側と同一 2026-08-20）
    const danballVal=(carVal==="西濃"||carVal==="佐川"||/無節|特上小/.test(grade))?"有":"無";  // 引取以外(西濃・佐川)は段ボール必須。等級 特上小/無節も有
    const uid=("od_"+String(o.id||o.orderNo)+"_"+idx).replace(/[.#$/\[\]:]/g,"_");
    const row={_uid:uid, order:"4",
      customer:pre+sur, carrier:carVal,
      hinmei:hin, grade:grade,
      thickness:d[0], width:((hin==="F"||hin==="P")?"120":d[1]), length:d[2], // 加工幅は原板120(羽目板103/ﾌﾛｰﾘﾝｸﾞ108→120表記)

      qty:String(qty), planned:String(planned), actual:actualVal,
      seal:"無", danball:danballVal, remark:rem.filter(Boolean).join(" ")};
    if(/カット/.test(opt)) row.ryoutan="1";  // 「カット+塗装」等どの表記でも両切ON（GAS側と同一判定）
    if(/塗装/.test(opt)) row.tosou="1";
    if(p.grade==="B" || /^B/.test(grade)) row.zaiko="1"; // B級=加工在庫。等級名がB始まりでない組合せ(B+無節等)も確実に付ける
    if(o.shipDate) row.due=String(o.shipDate).slice(0,10);  // 発送日→加工予定表の納期列（ISO）
    rows.push(row);
  });
  return rows;
}
// 既存行との重複判定：スタッフ手入力（例「楽天長谷川」）と同じ内容なら登録しない
// 一致条件＝取引先に姓が含まれる ＆ 品名・厚・長が同じ（幅・等級は手入力ゆれがあるため見ない）
async function kakouExisting_(){
  const snap=await kakouDb.ref("items").once("value");
  return Object.values(snap.val()||{});
}
// この注文に紐づく加工予定表行の「忘れちゃいけないメモ」を集める
// 自動登録行(od_注文ID_*)と手入力行(取引先に姓を含む・未出荷)の両方を見る
async function kakouNotesFor(o){
  try{
    if(!kakouDb) return [];
    const snap=await kakouDb.ref("items").once("value");
    const items=Object.values(snap.val()||{});
    const idPre=("od_"+String(o.id||o.orderNo)+"_").replace(/[.#$/\[\]:]/g,"_");
    const sur=kakouSur(o.customer);
    const notes=[];
    items.forEach(e=>{
      const note=String(e.important_note||"").trim();
      if(!note) return;
      const isOd=String(e._uid||"").indexOf(idPre)===0;
      const isManual=!!sur && !e.archived && String(e.customer||"").includes(sur);
      if(isOd||isManual) notes.push((e.customer?e.customer+"：":"")+note);
    });
    return [...new Set(notes)];
  }catch(err){ return []; }
}
function kakouDupOf_(row, existing){
  const sur=String(row.customer||"").replace(/様$/,"");
  if(!sur) return null;
  return existing.find(e=>{
    if(String(e._uid||"").indexOf("od_")===0) return false; // 自動登録行は固定キー上書きなので対象外
    if(e.archived) return false;                              // 出荷完了(アーカイブ)は対象外
    return String(e.customer||"").includes(sur)
        && String(e.hinmei)===String(row.hinmei)
        && String(e.thickness)===String(row.thickness)
        && String(e.length)===String(row.length);
  })||null;
}
async function kakouWrite_(o){
  const all=kakouRowsFor(o);
  const existing=await kakouExisting_();
  // 既に同じod_行がFirebaseにあれば上書きしない（現場の実際=数値・確認済み・並び等の編集を保護。
  // kakouAddedフラグが飛んで再登録が走っても初期値「配送確認」に巻き戻さない）
  const exUid=new Set(existing.map(e=>String(e._uid||"")));
  const rows=all.filter(r=>!exUid.has(String(r._uid)) && !kakouDupOf_(r,existing));
  const skipped=all.length-rows.length;
  for(const r of rows){ await kakouDb.ref("items/"+r._uid).set(r); }
  o.kakouAdded=true;
  const sv=(SERVER.orders||[]).find(x=>x.id===o.id); if(sv) sv.kakouAdded=true;
  apiPost({action:"order", id:o.id, kakouAdded:true});
  return {written:rows.length, skipped:skipped};
}
// 加工OKかつ未登録を自動登録（新規受注・出荷準備中のみ。出荷済/完了は対象外）
async function autoKakouSync(){
  if(!kakouDb || !kakouAuthed || _kakouBusy) return;
  _kakouBusy=true;
  try{
    // 注文が入った段階で登録（加工OK前でも）。未確認は実際列に「支払確認/配送確認」表示、加工OKで「-」
    const active=state.orders.filter(o=>!isTestOrder(o) && o.mall!=="ichiba" && (o.status==="new"||o.status==="preparing") && !o.tracking && kakouRowsFor(o).length); // テスト・送り状あり(加工済)・市場(人間チェック必須)は除外
    const inserts=active.filter(o=>!o.kakouAdded);
    for(const o of inserts){
      const r=await kakouWrite_(o);
      toast("🪵 加工予定表: "+orderName(o)+" "+(r.written?"登録"+r.written+"行":"")+(r.skipped?"（既存"+r.skipped+"スキップ）":""));
    }
    for(const o of active.filter(o=>o.kakouAdded)){ await kakouUpdateStatus_(o); } // 既登録は確認ステータスだけ追従更新
    const moved=await ichibaKakouStatusSync(); // 市場：予定表の移動（製造完了/出荷完了）に追従
    if(inserts.length||moved) render();
  }catch(e){ console.warn("加工予定表 同期失敗",e); }
  finally{ _kakouBusy=false; }
}
// 市場注文：加工予定表の行の状態からステータスを前進させる（後退はしない・手動移動は尊重）
// 全行アーカイブ＝出荷完了、全行が製造順9(製造完了)＝製造完了、行あり＝製造中
async function ichibaKakouStatusSync(){
  const targets=state.orders.filter(o=>o.mall==="ichiba" && o.kakouAdded && !isTestOrder(o) && o.status!=="done");
  if(!targets.length) return 0;
  const snap=await kakouDb.ref("items").once("value"); const items=snap.val()||{};
  const RANK={new:0, preparing:1, shipped:2, done:3};
  let moved=0;
  for(const o of targets){
    const pre=("od_"+String(o.id||o.orderNo)+"_").replace(/[.#$/\[\]:]/g,"_");
    const rows=Object.keys(items).filter(k=>k.indexOf(pre)===0).map(k=>items[k]);
    if(!rows.length) continue; // 行が見つからない（手入力運用や削除）は触らない
    let target="preparing";
    if(rows.every(r=>r.archived==="1")) target="done";
    else if(rows.every(r=>(parseInt(r.order||"0",10)||0)>=9||r.archived==="1")) target="shipped";
    if(RANK[target]>(RANK[o.status]||0)){
      o.status=target; const sv=(SERVER.orders||[]).find(x=>x.id===o.id); if(sv) sv.status=target;
      apiPost({action:"order", id:o.id, status:target});
      moved++;
    }
  }
  if(moved) toast("🏪 市場 "+moved+"件を加工予定表に合わせて移動しました");
  return moved;
}
// 既登録行の「実際(確認ステータス)」だけを追従更新。スタッフが数値等を入れていたら触らない
async function kakouUpdateStatus_(o){
  let rows=kakouRowsFor(o); const snaps={};
  for(const r of rows){
    try{ const snap=await kakouDb.ref("items/"+r._uid).once("value"); snaps[r._uid]=snap.val(); }catch(e){}
  }
  // 逆同期: 加工予定表で「配送確認」を外しポップアップでOKした行(ship_ok=1)→注文側にもチェックを入れる。
  // 先にこれをやらないと下の追従更新が「配送確認」へ書き戻してしまう（GAS側 ingestKakouAuto_ と同じ処理）
  const okKeys=rows.map(r=>r._uid).filter(u=>{ const e=snaps[u]; return e && (e.ship_ok==="1"||e.ship_ok===1||e.ship_ok===true); });
  if(okKeys.length && !o.shipConfirmed){
    o.shipConfirmed=true;
    const sv=(SERVER.orders||[]).find(x=>x.id===o.id); if(sv) sv.shipConfirmed=true;
    if(API_URL) apiPost({action:"order", id:o.id, shipConfirmed:true});
    rows=kakouRowsFor(o);   // 確認済みとして「実際」を再計算（未入金なら支払確認・済みなら"-"）
    toast("🚚 加工予定表から: "+orderName(o)+" を配送確認済みにしました");
  }
  for(const u of okKeys){ try{ await kakouDb.ref("items/"+u+"/ship_ok").remove(); }catch(e){} }
  for(const r of rows){
    const ex=snaps[r._uid]; if(!ex) continue;
    const a=ex.actual;
    if((a==="配送確認"||a==="注文確定"||a==="支払確認"||a==="-"||a===""||a==null) && a!==r.actual){
      try{ await kakouDb.ref("items/"+r._uid+"/actual").set(r.actual); }catch(e){}
    }
  }
}
// ドロワー保存時: 法人名(取引先)・発送日(納期)・着日(備考の着指定)を加工予定表の既存行へ即反映。
// 備考は「MM/DD着指定」の部分だけ書き換え、スタッフの追記(送り状FAX等)は温存する
async function kakouApplyOrderInfo(o){
  if(!kakouDb || !kakouAuthed) return;
  const dueTok=(o.dueOverride||o.deliveryDate)?String(o.dueOverride||o.deliveryDate).slice(5,10).replace("-","/")+"着指定":"";
  for(const r of kakouRowsFor(o)){
    try{
      const snap=await kakouDb.ref("items/"+r._uid).once("value"); const ex=snap.val();
      if(!ex || ex.archived==="1") continue;
      const upd={};
      if(r.customer && ex.customer!==r.customer) upd.customer=r.customer;                      // 法人名確認済→「楽天(株)◯◯」
      if(r.due && ex.due!==r.due) upd.due=r.due;                                               // 発送日→納期
      if(dueTok){
        const rm=String(ex.remark||"");
        const nrm=/\d{1,2}\/\d{1,2}着指定/.test(rm) ? rm.replace(/\d{1,2}\/\d{1,2}着指定/g,dueTok) : (rm?rm+" "+dueTok:dueTok);
        if(nrm!==rm) upd.remark=nrm;
      }
      if(Object.keys(upd).length) await kakouDb.ref("items/"+r._uid).update(upd);
    }catch(e){}
  }
}
// 送り状の総個口（全商品分の合計）
function kouguchiTotal(o){
  let k=0;
  (o.items||[]).forEach(it=>{ const p=parseItem(it.name); if(!p.dim) return; const d=p.dim.split("×"); const len=Number(d[2])||0; const per=parseInt(p.qty)||0, n=Number(it.qty)||1, total=per*n; if(!total) return; k += len>=1820?Math.ceil(total/10):Math.max(1,Math.ceil(total/40)); });
  return k||1;
}

const KAKOU_GRADES=["-","丸節","小節","特上小","無節","無節特上","生節","B丸節","B無節特上"];
// 幅狭品(定番外: フローリング93/羽目板88)は加工幅105・入数 2m4m=9枚/3m=11枚
function _isNarrow_(hin,w){ w=Number(w)||0; return (hin==="F"&&w===93)||(hin==="P"&&w===88); }
function _kakouNarrowNyusu_(len){ len=Number(len)||0; if(len>=3600)return "9"; if(len>=2700)return "11"; if(len>=1800)return "9"; return ""; }
function _kakouLen2Nyusu_(len){ len=Number(len)||0; if(len>=3600)return "8"; if(len>=2700)return "10"; if(len>=1800)return "8"; return ""; } // 市場束物の入数目安: 2m=8/3m=10/4m=8
// 取引先ごとのシール・段ボールマスタ(加工予定表 sealList)から該当先を探す（表記ゆれは空白除去で緩くマッチ）
function _sealMaster_(customer){
  const list=window._sealList||[]; const c=String(customer||"").replace(/[\s　]/g,"").replace(/様$/,"");
  if(!c) return null;
  for(const r of list){ const n=String(r.name||"").replace(/[\s　]/g,""); if(n&&(c.indexOf(n)>=0||n.indexOf(c)>=0)) return r; }
  return null;
}
// シール・段ボールの既定を「配送 → 取引先マスタ → 等級」の優先で決める
function _kakouAutoSD_(row){
  const m=_sealMaster_(row.customer);
  let seal,danball;
  if(row.carrier==="西濃"||row.carrier==="佐川"){ seal="無"; danball="有"; }   // 引取以外(西濃・佐川)=シールなし・段ボール必須
  else{
    seal = row.carrier==="内藤" ? "有" : (m? (m.seal?"有":"無") : "無");        // 内藤=シール有／他は取引先マスタ
    danball = (m&&m.danball) ? "有" : (/無節|特上小/.test(row.grade)?"有":"無"); // 段ボールは取引先マスタ有 or 特上小/無節のみ（丸節等は無）
  }
  return {seal,danball};
}
// 市場取引先の予定表表示名（社名＋拠点の略記）: 丸宇木材下館市場→丸宇下館 / ナイス(株)相模原→ナイス相模原 / 十亻入株式会社 相模原→ナイス相模原
function ichibaShortName(name){
  let t=String(name||"").replace(/[（(]株[）)]|[（(]有[）)]|株式会社|有限会社|合同会社|合資会社/g,"").replace(/[\s　]+/g,"").trim();
  t=t.replace(/十亻入|十亻又|ナイス/g,"ナイス").replace(/Aishin\s*Hikari|アイシンヒカリ/gi,"ひかり").replace(/HIKARI|Hikari|hikari|ヒカリ/g,"ひかり");  // OCRゆれ吸収・ひかり表記に統一
  const brand=(t.match(/丸宇|ナイス|ニッチ|吉貞|勝山|中央木材|ミトモク|千葉木材|ひかり|アイザワ|糸永|金平|オオツカ|滝川|カネ信|内藤運輸/)||[])[0]||"";
  if(!brand) return t.replace(/木材|市場|営業所|支店|木材店/g,"").slice(0,10);
  let rest=t.replace(brand,"").replace(/木材|市場|営業所|支店|木材店|センター/g,"").trim();  // 拠点名だけ残す
  return (brand+rest).slice(0,10);
}
function _kakouBlankRow_(o){
  const pre=o.mall==="rakuten"?"楽天":o.mall==="yahoo"?"ヤフ":o.mall==="ichiba"?"":"ネット";
  const sur=o.mall==="ichiba"?ichibaShortName(o.customer):kakouSur(o.customer);
  const car=shipCarrier(o);
  // 市場は既定なし。ただしナイス沼津は浜松市場へ自社搬入が定型のため「自社」を既定に
  const carrier=o.mall==="ichiba" ? (/ナイス\s*沼津|沼津木材/.test(String(o.customer||""))?"自社":"") : (car==="西濃"?"西濃":"");
  const row={customer:pre+sur, carrier:carrier, hinmei:"F", grade:"-",
    thickness:"", width:"120", length:"", qty:"", planned:"1", seal:"無", danball:"無", due:"", remark:""};
  const sd=_kakouAutoSD_(row); row.seal=sd.seal; row.danball=sd.danball;
  return row;
}
// 入数【n枚】が取れない注文(束数のみ等)でも、AI読取の品名から等級・寸法・予定(束数)を事前入力する
function _kakouPrefillRows_(o){
  const out=[];
  (o.items||[]).forEach(it=>{
    const p=parseItem(it.name); if(!p.dim) return;
    const d=p.dim.split("×"); if(d.length<3) return;
    const hin=/フローリング/.test(p.type)?"F":/羽目板/.test(p.type)?"P":/スノコ/.test(p.type)?"S":"F";
    const b=_kakouBlankRow_(o);
    b.hinmei=hin; b.grade=kakouGradeOf(p.fushi,p.grade)||"-";
    const _w0=Number(d[1])||0, _narrow=_isNarrow_(hin,_w0);
    b.thickness=d[0]; b.width=_narrow?"105":((hin==="F"||hin==="P")?"120":d[1]); b.length=d[2];  // 幅狭品(F93/P88)は加工幅105
    const bund=Number(it.qty)||1;
    b.planned=String(bund);                 // 束数＝予定(個口)に仮置き
    b.qty=_narrow?_kakouNarrowNyusu_(d[2]):_kakouLen2Nyusu_(d[2]);  // 入数の目安（通常2m8/3m10/4m8・幅狭2m4m=9/3m=11）
    if(o.mall==="ichiba" && bund<=10 && !b.carrier) b.carrier="西濃";   // 10束以下は西濃を既定
    if(o.mall==="ichiba" && bund>=20 && !b.carrier) b.carrier="内藤";  // 数量20以上は内藤を既定（自社等の既定があれば尊重）
    b.due=o.dueOverride||o.deliveryDate||"";  // 納期＝着指定日があれば初期表示
    const sd=_kakouAutoSD_(b); b.seal=sd.seal; b.danball=sd.danball;
    out.push(b);
  });
  return out.length?out:[_kakouBlankRow_(o)];
}

function _kakouEdCollect_(){
  const ed=state._kakouEd;

// 指定行をそのまま書き込む（編集済み行用。dup=スタッフ手入力行と重複はスキップ）
async function kakouWriteRows_(o,rows){
  const existing=await kakouExisting_();
  const wr=rows.filter(r=>!kakouDupOf_(r,existing));
  for(const r of wr){ await kakouDb.ref("items/"+r._uid).set(r); }
  o.kakouAdded=true;
  const sv=(SERVER.orders||[]).find(x=>x.id===o.id); if(sv) sv.kakouAdded=true;
  apiPost({action:"order", id:o.id, kakouAdded:true});
  return {written:wr.length, skipped:rows.length-wr.length};
}

// 西濃の支店住所をGASの営業所マスタから取得（運賃ツールの営業所検索が間に合わない時の確実な補完）
async function seinoBranchAddr(branch){
  const b=String(branch||"").replace(/営業所$|支店$/,""); if(!b) return "";
  window._brAddrCache=window._brAddrCache||{};
  if(window._brAddrCache[b]!==undefined) return window._brAddrCache[b];
  try{
    const u=new URL(API_URL); u.searchParams.set("action","seinoaddr"); u.searchParams.set("branch",b);
    u.searchParams.set("email",CRED.email); u.searchParams.set("pass",CRED.pass);
    const r=await fetch(u.toString()).then(x=>x.json());
    const a=(r&&r.ok&&r.addr)?("〒"+String(r.zip||"").replace(/^(\d{3})(\d{4})$/,"$1-$2")+" "+r.addr):"";
    window._brAddrCache[b]=a; return a;
  }catch(e){ return ""; }
}

function matchFilter(o){
  if(o.docType==="対象外" && !state.showTaishogai) return false;  // 対象外=アーカイブ（市場タブのトグルで表示可）
  const isQuote=(o.docType==="見積り");
  if(state.tab==="mitsumori"){ if(!isQuote) return false; }                       // 見積りタブ＝見積りのみ(市場・EC両方)
  else if(state.tab==="ichiba"){ if(o.mall!=="ichiba"||isQuote) return false; }   // 市場タブ＝市場の注文(見積り除く)
  else if(o.mall==="ichiba"||isQuote) return false;                                 // ECタブ＝市場・見積りを出さない
  if(state.tab==="orders" && state.mall!=="all" && o.mall!==state.mall) return false;
  const s = state.search.trim().toLowerCase();
  if(!s) return true;
  const hay = [o.orderNo, o.customer, o.subject, (o.items?o.items.map(i=>i.name).join(" "):"")].join(" ").toLowerCase();
  return hay.includes(s);
}

}

// 備考の見落とし防止: 備考ありの注文を開いたらポップアップ（注文ごとに初回のみ・備考が変わったら再表示・完了は出さない）
function maybeRemarkPopup(o){
  const r=String(o.remarks||"").trim(); if(!r || o.status==="done") return;
  const key="remarkAck_"+o.id;
  try{ if(localStorage.getItem(key)===r) return; }catch(e){}
  setTimeout(()=>{ alert("📝 お客様備考があります（見落とし注意）\n\n"+r); try{ localStorage.setItem(key,r); }catch(e){} }, 150);
}
// 楽天・新規・西濃(配送確認要)・メール未送信の注文は、ドロワーを開いた瞬間に運賃計算→文面生成まで自動実行。
// 送料が届き次第 genConfirmMail が走り、プレビュー＋「📨送信」ボタンが出る＝手動の運賃計算/文面生成クリックが不要に。
function autoPrepareMail(o){
  if(!(o && o.mall==="rakuten" && o.status==="new" && needsShipConfirm(o) && !o.mailSent)) return;
  const btn=document.querySelector('#d-body [data-fare]');
  if(!btn || btn.dataset.loaded) return;   // 既に計算済みなら二重起動しない
  window._autoDraftId=o.id;
  try{ loadFareInline(btn); }catch(e){ window._autoDraftId=null; }
}
function saveOrderFromDrawer(){
  const o=getOrder(state.drawer.id);
  const sel=$("#o-status").querySelector("button.active");
  o.status = sel?sel.dataset.s:o.status;
  const trackEl=$("#o-track"); if(trackEl) o.tracking = trackEl.value.trim(); // 楽天は下の書き戻し欄が担当（上は非表示）
  o.memo = $("#o-memo").value.trim();
  o.customer = $("#o-cust").value.trim();
  const _g=id=>document.getElementById(id);
  if(_g("seino-corp-name")) o.corpName=_g("seino-corp-name").value.trim();
  if(_g("seino-corp-zip"))  o.corpZip=_g("seino-corp-zip").value.trim();
  if(_g("seino-corp-addr")) o.corpAddr=_g("seino-corp-addr").value.trim();
  if(_g("seino-due"))       o.dueOverride=_g("seino-due").value.trim();
  if(_g("seino-date"))      o.shipDate=_g("seino-date").value.trim();  // 発送日（加工予定表の納期に反映）
  window._drawerSnap=null;  // 保存済み→閉じる時の未保存確認を出さない
  saveOrderOverlay(o);
  kakouApplyOrderInfo(o);  // 法人名・発送日・着日を加工予定表の既存行へ即反映
  closeDrawer(); render(); toast("保存しました");
}

/* ---- 楽天 書き戻し（受注確定・発送処理） ---- */
async function apiCall(body){
  const res = await fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(Object.assign({email:CRED.email, pass:CRED.pass}, body))});
  return await res.json();
}
function rkMsg(r){ return (r.messages&&r.messages.map(m=>m.message).filter(Boolean).join(" / ")) || r.error || ("HTTP"+(r.code||"?")); }
function toggleShipConfirm(){
  const o=getOrder(state.drawer.id); if(!o) return;
  o.shipConfirmed=$("#o-shipconf").checked;
  if(API_URL) apiPost({action:"order", id:o.id, shipConfirmed:o.shipConfirmed});
  render(); openOrderDrawer(o.id);
  toast(o.shipConfirmed?"配送確認済みにしました":"配送確認を外しました");
  autoKakouSync(); // チェックで加工OKになったら即・加工予定表へ
}
function toggleMailSent(){
  const o=getOrder(state.drawer.id); if(!o) return;
  o.mailSent=$("#o-mailsent").checked;
  if(API_URL) apiPost({action:"order", id:o.id, mailSent:o.mailSent});
  render(); openOrderDrawer(o.id);
  toast(o.mailSent?"配送確認メール送信済みにしました":"未送信に戻しました");
}
async function rakutenConfirmFromDrawer(){
  const o=getOrder(state.drawer.id); if(!o) return;
  const warn = needsFreight(o) ? "⚠️ 2m以上の商品です。\n運賃見積り→お客様了承→楽天で送料追加 は完了していますか？\n（未完了なら先に楽天R-Backofficeで送料を追加してください）\n\n" : "";
  if(!confirm(warn+"楽天でこの注文を「受注確定」します。よろしいですか？")) return;
  toast("楽天へ送信中…");
  try{ const r=await apiCall({action:"rakutenConfirm", id:o.id, orderNo:o.orderNo});
    if(r.ok){ toast("楽天で受注確定しました"); closeDrawer(); loadFromServer(); }
    else toast("失敗: "+rkMsg(r)); }
  catch(e){ toast("通信エラー"); }
}

  const o=getOrder(state.drawer.id); if(!o) return;
  const carrier=$("#rk-carrier").value, tn=$("#rk-track").value.trim(), date=$("#rk-date").value;
  if(!tn){ toast("送り状番号を入力してください"); return; }
  if(!confirm("楽天に発送処理を送信します。\n\n・お客様へ「発送完了メール」が自動送信されます\n・注文が「発送済」になります\n\nよろしいですか？")) return;
  toast("楽天へ送信中…");
  try{ const r=await apiCall({action:"rakutenShip", id:o.id, orderNo:o.orderNo, carrierCode:carrier, trackingNumber:tn, shippingDate:date});
    if(r.ok){ toast("楽天に発送処理を送信しました"); closeDrawer(); loadFromServer(); }
    else toast("失敗: "+rkMsg(r)); }
  catch(e){ toast("通信エラー"); }
}

async function seinoPdfView(no){
  toast("送り状PDFを取得中…");
  try{
    const r=await fetch(API_URL+"?action=seinopdf&no="+encodeURIComponent(no)+"&email="+encodeURIComponent(CRED.email)+"&pass="+encodeURIComponent(CRED.pass));
    const j=await r.json();
    if(!j.ok||!j.pdf){ toast("PDFを取得できませんでした"); return; }
    const bin=atob(j.pdf); const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([arr],{type:"application/pdf"}));
    window.open(url,"_blank");
  }catch(e){ toast("通信エラー"); }
}
async function honjitsuRun(){
  const today=new Date().toISOString().slice(0,10);
  const todayYmd=today.replace(/-/g,"");
  const targets=state.orders.filter(o=>o.seinoOkurijoNo&&String(o.seinoShukkaDate||"")===todayYmd);
  const rkCount=targets.filter(o=>o.mall==="rakuten"&&!o.seinoNotified).length;
  const msg="📦 本日出す（"+today+"）を実行します。\n\n"
    +"・本日発行した西濃送り状: "+targets.length+"件（＋送り状デスク発行分も集荷に合算）\n"
    +"・楽天へ発送処理（発送完了メール送信）: "+rkCount+"件\n"
    +"・出荷一覧表を袋井支店へeFAX送信\n"
    +"・西濃へWeb集荷依頼（当日16時希望／15時以降の実行は翌営業日16時）\n\n"
    +"よろしいですか？";
  if(!confirm(msg)) return;
  toast("本日出す処理を実行中…");
  try{
    const r=await apiCall({action:"honjitsu"});
    if(!r.ok){ toast("失敗: "+(r.error||"")); return; }
    const rkNg=(r.rakuten||[]).filter(x=>!x.ok);
    let s="✅ 対象"+r.targets+"件";
    s+=" / 楽天通知 "+((r.rakuten||[]).length-rkNg.length)+"件OK"+(rkNg.length?("・"+rkNg.length+"件失敗"):"");
    s+=" / FAX "+(r.efax&&r.efax.ok?"送信済":"失敗("+((r.efax&&r.efax.error)||"")+")");
    s+=" / 集荷 "+(r.pickup&&r.pickup.queued?("依頼キュー済("+r.pickup.kosu+"個口"+r.pickup.weightKg+"kg・1分以内に送信)"):"対象なし");
    alert(s+(rkNg.length?("\n\n楽天失敗:\n"+rkNg.map(x=>x.orderNo+" "+x.detail).join("\n")):""));
    loadFromServer();
  }catch(e){ toast("通信エラー"); }
}
function jumpToInquiryByOrder(oid){

function openInqDrawer(id){
  const q=getInq(id); if(!q) return; state.drawer={type:"inquiry", id};
  const m=MALL[q.mall];
  $("#d-head").innerHTML=`<span class="badge ${m.cls}">${m.label}</span><h3>${esc(q.subject)}</h3><button class="d-close" onclick="closeDrawer()">✕</button>`;
  const tplOpts = state.templates.map((t,i)=>`<option value="${i}">${esc(t.title)}</option>`).join("");
  const histHtml = (q.history&&q.history.length)
    ? q.history.map(h=>`<div class="h-item">🕒 ${esc(h.at)}　${esc(h.text)}</div>`).join("")
    : `<div class="h-item">まだ対応履歴はありません</div>`;
  $("#d-body").innerHTML=`
    <div class="kv">
      <span class="k">お客様</span><span class="v">${esc(q.customer)} 様</span>
      <span class="k">受信日時</span><span class="v">${esc(q.date)}</span>
      ${q.orderNo?`<span class="k">注文番号</span><span class="v">${esc(q.orderNo)}</span>`:""}
    </div>
    <div class="sec-t">対応ステータス</div>
    <div class="status-pick" id="q-status">
      ${Q_STATUS.map(s=>`<button data-s="${s.k==='done'?'replied':s.k}" data-real="${s.k}" class="${q.status===s.k?'active':''}">${s.label}</button>`).join("")}
    </div>
    <div class="sec-t">お客様からのメッセージ</div>
    <div class="msg-quote">${esc(q.body)}</div>

    <div class="sec-t">返信下書き</div>
    <div class="tplbar">
      <select class="sel" id="q-tpl" style="flex:1"><option value="">テンプレートを選ぶ…</option>${tplOpts}</select>
      <button class="btn ghost sm" id="q-tpl-insert">差し込む</button>
    </div>
    <textarea class="txt" id="q-draft" placeholder="返信文を入力（テンプレを差し込めます）" style="margin-top:8px">${esc(q.draft||"")}</textarea>

    <div class="sec-t">対応履歴</div>
    <div class="hist">${histHtml}</div>
  `;
  $("#d-foot").innerHTML=`
    <button class="btn primary grow" onclick="copyAndOpenMall()">📋 コピーして${m.label}を開く</button>
    <button class="btn ghost" onclick="markReplied()">返信済にする</button>
  `;
  $("#q-status").querySelectorAll("button").forEach(b=>{
    b.onclick=()=>{ $("#q-status").querySelectorAll("button").forEach(x=>x.classList.remove("active")); b.classList.add("active"); persistInqStatus(); };
  });
  $("#q-tpl-insert").onclick=()=>{
    const i=$("#q-tpl").value; if(i==="") return;
    const t=state.templates[Number(i)]; const ta=$("#q-draft");
    ta.value = ta.value ? (ta.value.replace(/\s+$/,"")+"\n\n"+t.body) : t.body;
    ta.focus();
  };
  $("#q-draft").addEventListener("input", debounce(()=>{ const qq=getInq(state.drawer.id); qq.draft=$("#q-draft").value; saveInqOverlay(qq); },400));
  openDrawer();
}
function persistInqStatus(){
  const q=getInq(state.drawer.id);
  const sel=$("#q-status").querySelector("button.active");
  const real = sel?sel.dataset.real:q.status;
  if(real!==q.status){ q.status=real; saveInqOverlay(q); renderKPIs(); }
}
async function copyAndOpenMall(){
  const q=getInq(state.drawer.id);
  const text=$("#q-draft").value.trim();
  if(!text){ toast("返信文が空です"); return; }
  q.draft=text;
  try{ await navigator.clipboard.writeText(text); }
  catch(e){ const ta=$("#q-draft"); ta.select(); document.execCommand("copy"); }
  // 履歴に記録＋対応中以上へ
  q.history=q.history||[]; q.history.unshift({at:now(), text:"返信文をコピー → "+MALL[q.mall].label+"の問い合わせ画面へ"});
  if(q.status==="todo") q.status="doing";
  saveInqOverlay(q);
  toast("返信文をコピーしました。開いた画面に貼り付けてください");
  window.open(q.replyUrl||MALL[q.mall].msgUrl,"_blank");
  // 履歴反映のため再描画
  setTimeout(()=>{ openInqDrawer(q.id); renderKPIs(); },150);
}
function markReplied(){
  const q=getInq(state.drawer.id);
  q.status="done"; q.history=q.history||[]; q.history.unshift({at:now(), text:"返信済にしました"});
  saveInqOverlay(q);
  // 関連注文のhasMsgフラグはそのまま（履歴目的）
  closeDrawer(); render(); toast("返信済にしました");
}

function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }

/* =========================================================
   Auth
========================================================= */
/* 認証方針：
   - デモ(API_URL未設定)＝メール+パスが入力されていれば入れる（資格情報はフロントに焼かない）。
   - 本番(API_URL設定)＝GAS側で BOARD_USERS 照合（salesboardと同方式）。ここでは送信のみ。 */
function tryAutoLogin(){
  let c=load(LS.cred,null);
  if(!(c&&c.email&&c.pass)){ const s=ssoFind_(); if(s){ c=s; save(LS.cred,s); } }
  if(c&&c.email&&c.pass&&authOk(c.email,c.pass)){ enterApp(c.email, c.pass); return true; }
  return false;
}
function authOk(email,pass){
  const e=(email||"").trim();
  if(!e || !pass) return false;
  if(!API_URL) return /.+@.+\..+/.test(e); // デモ：正しい形式のメール＋任意パスで入室
  return true; // 本番はサーバ側で照合（暫定。GET時に unauthorized 判定）
}
function doLogin(){
  const email=$("#g-email").value.trim(), pass=$("#g-pass").value;
  if(!authOk(email,pass)){ $("#g-err").textContent="メールまたはパスワードが違います"; return; }
  const keep=$("#g-keep").checked;
  if(keep){ save(LS.cred,{email,pass}); ssoWrite(email,pass); } else { localStorage.removeItem(LS.cred); sessionStorage.setItem(LS.cred,JSON.stringify({email,pass})); }
  enterApp(email, pass);
}
function logout(){ localStorage.removeItem(LS.cred); sessionStorage.removeItem(LS.cred); localStorage.removeItem(LS.serverCache); ssoClear(); location.reload(); }
function enterApp(email, pass){
  CRED = {email, pass};
  $("#gate").classList.add("hidden"); $("#app").classList.remove("hidden");
  $("#h-sub").textContent = "林材木店 EC ・ "+(email.split("@")[0]);
  buildData(); render();
  initKakou(); // 加工予定表Firebaseへ匿名認証（自動登録用）
  if(API_URL) loadFromServer();
  // 自動更新：3分ごと＋タブ復帰時（ドロワー編集中・タブ非表示はスキップ＝入力を消さない）
  if(API_URL && !window._autoRefresh){
    window._autoRefresh = setInterval(()=>{ if(!document.hidden && !state.drawer && CRED) loadFromServer(); }, 180000);
    document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && !state.drawer && CRED) loadFromServer(); });
  }
}

/* =========================================================
   Wire up
========================================================= */
function initTheme(){
  const t=load(LS.theme,null) || (matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  document.documentElement.dataset.theme=t;
}
document.addEventListener("DOMContentLoaded",()=>{
  initTheme();
  // gate
  if(!API_URL) $("#g-demo").classList.remove("hidden");
  else $("#demo-banner").classList.add("hidden");
  $("#g-btn").onclick=doLogin;
  $("#g-pass").addEventListener("keydown",e=>{ if(e.key==="Enter") doLogin(); });
  // session cred fallback
  const sc=sessionStorage.getItem(LS.cred); if(sc){ try{ const c=JSON.parse(sc); if(authOk(c.email,c.pass)){ enterApp(c.email, c.pass); } }catch(e){} }
  if(!$("#app").classList.contains("hidden")) {} else if(!tryAutoLogin()){ /* show gate */ }

  // tabs
  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{ state.tab=t.dataset.tab; render(); });
  // mall seg
  document.querySelectorAll("#mall-seg button").forEach(b=>b.onclick=()=>{ state.mall=b.dataset.mall; render(); });
  // search
  $("#search").addEventListener("input", debounce(e=>{ state.search=e.target.value; render(); },200));
  // header buttons
  $("#btn-refresh").onclick=()=>{ if(API_URL){ toast("最新を取得中…"); loadFromServer(); } else { buildData(); render(); toast("再読み込みしました"); } };
  $("#btn-theme").onclick=()=>{ const cur=document.documentElement.dataset.theme; const nx=cur==="dark"?"light":"dark"; document.documentElement.dataset.theme=nx; save(LS.theme,nx); };
  $("#btn-settings").onclick=openSettings;
  // fab + scrim
  $("#fab").onclick=openAddDrawer;
  $("#scrim").onclick=closeDrawer;
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDrawer(); });
});
